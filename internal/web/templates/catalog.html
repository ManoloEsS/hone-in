<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recipes</title>
    <link rel="stylesheet" href="/static/css/catalog.css">
</head>
<body>
    <main>
        <h1>Recipes</h1>
        {{if .Recipes}}
        <ul>
            {{range .Recipes}}
            <li><a href="/recipes/{{.ID}}">{{.Name}}</a></li>
            {{end}}
        </ul>
        {{else}}
        <p>No recipes yet.</p>
        {{end}}
    </main>
</body>
</html>
